name: Deploy web demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install demo dependencies
        run: flutter pub get

      - name: Analyze demo
        run: flutter analyze

      - name: Test demo
        run: flutter test

      - name: Install package dependencies
        working-directory: packages/strategy_forge
        run: flutter pub get

      - name: Analyze package
        working-directory: packages/strategy_forge
        run: flutter analyze

      - name: Test package
        working-directory: packages/strategy_forge
        run: flutter test

      - name: Build web demo
        run: flutter build web --release --base-href /Strategy-Forge/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
