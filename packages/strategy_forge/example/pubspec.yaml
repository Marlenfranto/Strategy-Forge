name: strategy_forge_example
description: Example app for the Strategy Forge editor package.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"
dependencies:
  flutter:
    sdk: flutter
  strategy_forge:
    path: ..
  file_saver: ^0.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/rinks/
