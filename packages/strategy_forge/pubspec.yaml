name: strategy_forge
description: >-
  An embeddable Flutter strategy editor with configurable layouts, drawing
  tools, markers, JSON persistence, and PNG export.
version: 0.1.0
homepage: https://github.com/Marlenfranto/Strategy-Forge
repository: https://github.com/Marlenfranto/Strategy-Forge
issue_tracker: https://github.com/Marlenfranto/Strategy-Forge/issues
documentation: https://github.com/Marlenfranto/Strategy-Forge/tree/main/packages/strategy_forge
topics:
  - flutter
  - strategy
  - drawing
  - diagram
  - editor
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/tools/
    - assets/tools/universal/
  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf
    - family: CustomIcon
      fonts:
        - asset: assets/fonts/CustomIcon.ttf
